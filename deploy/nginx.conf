# Nginx dentro do container — HUBContábil (SPA React/Vite).
# HTTPS e domínio ficarão com o Traefik do Easypanel na VPS; aqui é só HTTP interno.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos do build têm hash no nome: cache de 1 ano.
    # (add_header dentro de location substitui os de cima, por isso eles se repetem.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html sem cache, para o navegador sempre pegar a versão nova após um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: qualquer rota (/pj/guias, /escritorio/clientes...) devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
